<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2F38"/>
      <stop offset="1" stop-color="#121418"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0.4" y2="0">
      <stop offset="0" stop-color="#16B47C"/>
      <stop offset="1" stop-color="#7DF2C2"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- macOS icon grid: 824px body centred on a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <!-- bars, clipped to the lens -->
  <clipPath id="lens"><circle cx="460" cy="455" r="162"/></clipPath>
  <g clip-path="url(#lens)">
    <rect x="364" y="470" width="50" height="110" rx="16" fill="url(#bar)" opacity="0.75"/>
    <rect x="435" y="410" width="50" height="170" rx="16" fill="url(#bar)" opacity="0.88"/>
    <rect x="506" y="345" width="50" height="235" rx="16" fill="url(#bar)"/>
  </g>
  <!-- loupe -->
  <circle cx="460" cy="455" r="190" fill="none" stroke="#F5F6F8" stroke-width="56"/>
  <line x1="606" y1="601" x2="742" y2="737" stroke="#F5F6F8" stroke-width="76" stroke-linecap="round"/>
</svg>
